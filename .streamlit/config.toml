[client]
# The Deploy button, the ⋮ developer menu and "Stop" are Streamlit's tools for
# the person building the app, not for a production crew. "minimal" hides the
# menu and Deploy; nothing the crew uses lives there. The theme switch in that
# menu would also have let someone flip Streamlit to light mode underneath a
# stylesheet that only knows dark.
toolbarMode = "minimal"
