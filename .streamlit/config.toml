# ---------------------------------------------------------------------------
# إعدادات CimaFast Studio
#
# مهم: الملف ده بيتقرا مرة واحدة وقت تشغيل الخدمة، فمينفعش يتغير حسب
# الـ query params. كل حاجة مشروطة بالـ flag ‎?theme=glass‎ لازم تتعمل
# من طبقة الـ CSS في theme/ مش من هنا.
# ---------------------------------------------------------------------------

[server]
# لازم تفضل مفتوحة عشان الخطوط المستضافة محليًا في static/fonts تتخدم
enableStaticServing = true

[theme]
# ألوان دليل البراند الرسمي v1.0 (صفحة 05 · Colour)، الوضع الغامق.
# القيم دي لازم تفضل مطابقة لـ theme/tokens.py — Streamlit بيرسم بيها
# عناصره الداخلية اللي مش بنلمسها بـ CSS، والـ CSS بيرسم الباقي.
base = "dark"
primaryColor = "#FECA05"              # CF Yellow — اللكنة في الوضع الغامق
backgroundColor = "#0F1B45"           # CF Midnight — الصفحة
secondaryBackgroundColor = "#1A2860"  # CF Navy Surface — الكروت والخانات
textColor = "#FFFFFF"
font = "Inter, Cairo, sans-serif"
headingFont = "Inter, Cairo, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, monospace"

# ---------------------------------------------------------------------------
# الخطوط: Inter للاتيني و Cairo للعربي (دليل البراند ص 06 · Typography).
#
# الترتيب "Inter, Cairo" هو كل الحيلة: Inter مفيهوش حرف عربي واحد، فالمتصفح
# بيقع تلقائيًا على Cairo لأي حرف عربي — من غير ما نفحص اللغة في بايثون ولا
# نلف العربي في عنصر لوحده. الاتنين خطوط متغيرة (Inter 100–900،
# Cairo 200–1000) فوزن 800 بتاع الووردمارك متاح من نفس الملف.
#
# مستضافين محليًا في static/fonts بدل CDN جوجل — مفيش طلب خارجي بيوقف الرسم.
# متقسمين بنطاقات اليونيكود زي جوجل بالظبط، عشان المتصفح ينزّل الجزء اللي
# محتاجه بس (العربي 31KB، اللاتيني 48KB).
#
# Readex Pro لسه هنا كخط احتياطي للأنظمة اللي الخطين الجداد ميحمّلوش عليها،
# وعشان أي مرجع قديم للاسم ميقعش على خط النظام.
# ---------------------------------------------------------------------------
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-var.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-ext-var.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

